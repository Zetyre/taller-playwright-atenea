name: CI - cloning, building and testing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on:ubuntu-latest
    
    services:
      mongo:
        image: mongodb:7.0.3
        ports:
          - 27017:27017
  env:
    MONGO_URI: ${{ secrets.MONGO_URI }}
    JWT_SECRET: ${{ secrets.JWT_SECRET }}
    PORT: 6007
    VITE_API_URL: http://localhost:6007/api

  steps:
  
    - name: Checkout actual repository
      uses: actions/checkout@v3
    
    - name: Clone redux-athena-bank repository
      run: |
        git clone git@github.com:Atenea-Conocimientos/redux-athena-bank.git app
    
    - name: Create .env file for backend 
      run: |
        echo "MONGO_URI=${{ env.MONGO_URI }}" > app/backend/.env
        echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> app/backend/.env
        echo "PORT=${{ env.PORT }}" >> app/backend/.env
        echo "VITE_API_URL=${{ env.VITE_API_URL }}" >> app/backend/.env
    
    - name: Install dependencies for backend
      run: |
        cd app/backend
        npm install 

    - name: Build backend
      run: |
        cd app/backend
        npm run dev > backend.log 2>&1 &
    - name: Install wait-on
      run: npm install -g wait-on

    - name: Wait for backend to be ready at PORT 6007
      run: wait-on TCP:6007

    - name: Install dependencies for frontend
      run: |
        cd app/frontend 
        npm install
      env:
        VITE_API_URL: ${{ env.VITE_API_URL }} 

    - name: Wait for frontend to be ready at PORT 3000
      run: wait-on TCP:3000    
