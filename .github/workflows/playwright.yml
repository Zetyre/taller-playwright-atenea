name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full regression across every browser, 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high

      # The browser image must match the installed Playwright version exactly.
      # Reading it from the lockfile means a Dependabot bump updates both together.
      - name: Read the locked Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: Test (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.quality.outputs.playwright-version }}-noble
      options: --ipc=host
    services:
      mongodb:
        image: mongo:7.0.3
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOME: /root # Firefox refuses to start in this container when HOME is not owned by the user.
      MONGO_URI: mongodb://mongodb:27017/athena_bank
      JWT_SECRET: ci-only-throwaway-secret # Signs tokens for an ephemeral CI database only.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:6007
      PLAYWRIGHT_TEST_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the pinned Athena Bank app
        run: |
          git init app
          git -C app remote add origin https://github.com/Zetyre/redux-athena-bank.git
          git -C app fetch --depth 1 origin ecab87e1aee435fd090a8e05b281c89331e275d0
          git -C app checkout --detach FETCH_HEAD

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/backend/package-lock.json
            app/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app/backend
          npm ci --prefix app/frontend

      - name: Build the frontend
        # Tests run against a production build (vite preview), not the dev server with HMR.
        if: matrix.project != 'api'
        run: npm --prefix app/frontend run build

      - name: Start the app and run the tests
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/app-logs"
          mkdir -p "$logs"

          npm --prefix app/backend start >"$logs/backend.log" 2>&1 &
          pids=($!)
          if [[ "$PROJECT" != api ]]; then
            (cd app/frontend && npx vite preview --host 0.0.0.0 --port 3000 --strictPort) >"$logs/frontend.log" 2>&1 &
            pids+=($!)
          fi
          trap 'kill "${pids[@]}" 2>/dev/null || true' EXIT

          wait_for() {
            local name="$1" url="$2" log="$3"
            for _ in {1..60}; do
              if curl --fail --silent "$url" >/dev/null; then echo "$name is ready"; return 0; fi
              sleep 2
            done
            echo "::error::$name did not start at $url"; cat "$log"; return 1
          }
          wait_for Backend "$API_BASE_URL/" "$logs/backend.log"
          [[ "$PROJECT" == api ]] || wait_for Frontend "$PLAYWRIGHT_BASE_URL/" "$logs/frontend.log"

          # Pull requests run the full suite on api and chromium and the smoke suite on firefox and webkit.
          # Pushes to main and the nightly run cover everything.
          args=(--project="$PROJECT")
          if [[ "$SUITE" == smoke ]] \
            || [[ "$EVENT" == pull_request && ( "$PROJECT" == firefox || "$PROJECT" == webkit ) ]]; then
            args+=(--grep @smoke)
          fi
          echo "Running: npx playwright test ${args[*]}"
          npx playwright test "${args[@]}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

  report:
    name: Merge reports
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Write the job summary
        run: node scripts/ci-summary.mjs results.json >> "$GITHUB_STEP_SUMMARY"

      # Traces, screenshots and videos only contain throwaway users from the ephemeral CI database,
      # so the full report is kept as a short-lived artifact for debugging failures.
      - name: Upload full HTML report (with traces)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Publish report to GitHub Pages
    needs: [e2e, report]
    if: >-
      ${{ !cancelled() && needs.report.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report

      - name: Add the report to the gh-pages archive
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.e2e.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add --track -b gh-pages "$pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$pages"
          fi

          # Public copy: drop attachments (traces, screenshots, videos). The full report stays in the artifact.
          target="$pages/report-$RUN_NUMBER"
          rm -rf -- "$target"
          cp -a "$RUNNER_TEMP/playwright-report/." "$target/"
          rm -rf -- "$target/data" "$target/trace"
          status=$([[ "$TEST_RESULT" == success ]] && echo passed || echo failed)
          printf '%s\n%s\n%s\n%s\n' "$status" "$EVENT" "$(date -u +%Y-%m-%dT%H:%MZ)" "$RUN_URL" > "$target/run-info.txt"
          touch "$pages/.nojekyll"

          # Keep the 30 most recent reports.
          mapfile -t reports < <(find "$pages" -maxdepth 1 -type d -name 'report-[0-9]*' -printf '%f\n' | sort -V -r)
          for old in "${reports[@]:30}"; do rm -rf -- "${pages:?}/$old"; done
          reports=("${reports[@]:0:30}")

          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            printf '<title>Playwright reports</title>\n</head>\n<body>\n<h1>Playwright reports</h1>\n<ul>\n'
            for report in "${reports[@]}"; do
              info="$pages/$report/run-info.txt"
              if [[ -f "$info" ]]; then
                mapfile -t meta < "$info"
                printf '<li><a href="./%s/">%s</a> - %s - %s - %s - <a href="%s">run</a></li>\n' \
                  "$report" "$report" "${meta[0]}" "${meta[1]}" "${meta[2]}" "${meta[3]}"
              else
                printf '<li><a href="./%s/">%s</a></li>\n' "$report" "$report"
              fi
            done
            printf '</ul>\n</body>\n</html>\n'
          } > "$pages/index.html"

          git -C "$pages" add -A
          git -C "$pages" commit -m "Publish Playwright report $RUN_NUMBER ($status)"
          git -C "$pages" push origin gh-pages

  # The single required status check for branch protection on main.
  # It aggregates the jobs above, so adding, renaming or sharding matrix jobs never requires
  # changing the repository rules.
  # `if: always()` matters: GitHub treats a *skipped* required check as passing, so without it a
  # failed test job would skip this gate and let the pull request merge.
  test:
    name: test
    needs: [quality, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Show job results
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "e2e:     ${{ needs.e2e.result }}"

      - name: Fail unless every job succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed (failed, cancelled or skipped)."
          exit 1
