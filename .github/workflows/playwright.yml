name: Playwright CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, cicd ]
  pull_request:
    branches: [ main, master, cicd ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    permissions:
      contents: read
    outputs:
      report_available: ${{ steps.report-check.outputs.available }}
    services:
      mongodb:
        image: mongo:7.0.3
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://mongodb:27017/athena_bank
      JWT_SECRET: ci-only-secret
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:6007
      PLAYWRIGHT_TEST_SEED: ${{ github.run_id }}

    steps:
      - name: Check out test project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned Athena Bank app
        run: |
          git init app
          git -C app remote add origin https://github.com/Zetyre/redux-athena-bank.git
          git -C app fetch --depth 1 origin ecab87e1aee435fd090a8e05b281c89331e275d0
          git -C app checkout --detach FETCH_HEAD

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/backend/package-lock.json
            app/frontend/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Type-check tests
        run: npm run typecheck

      - name: Install app dependencies
        run: |
          npm ci --prefix app/backend
          npm ci --prefix app/frontend

      - name: Start app and run Playwright tests
        shell: bash
        run: |
          set -euo pipefail

          backend_log="$RUNNER_TEMP/athena-backend.log"
          frontend_log="$RUNNER_TEMP/athena-frontend.log"

          npm --prefix app/backend start >"$backend_log" 2>&1 &
          backend_pid=$!
          npm --prefix app/frontend run dev -- --host 0.0.0.0 >"$frontend_log" 2>&1 &
          frontend_pid=$!

          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            wait "$frontend_pid" "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_service() {
            local name="$1"
            local url="$2"
            local log_file="$3"
            local pid="$4"

            for attempt in {1..60}; do
              if curl --fail --silent "$url" >/dev/null; then
                echo "$name is ready"
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$name exited before becoming ready"
                cat "$log_file"
                return 1
              fi
              sleep 2
            done

            echo "Timed out waiting for $name at $url"
            cat "$log_file"
            return 1
          }

          wait_for_service "Backend" "$API_BASE_URL/" "$backend_log" "$backend_pid"

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const { usuarioValido } = JSON.parse(
            await readFile('data/testData.json', 'utf8'),
          );
          const response = await fetch(`${process.env.API_BASE_URL}/api/auth/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(usuarioValido),
          });

          if (response.status !== 201) {
            throw new Error(
              `Failed to seed the login test user: ${response.status} ${await response.text()}`,
            );
          }
          NODE

          wait_for_service "Frontend" "$PLAYWRIGHT_BASE_URL/" "$frontend_log" "$frontend_pid"
          npm run test:ci

      - name: Remove browser attachments from public artifacts
        if: always()
        run: rm -rf -- playwright-report/data test-results

      - name: Check for Playwright HTML report
        id: report-check
        if: always()
        shell: bash
        run: |
          if [[ -f playwright-report/index.html ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-report:
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.test.outputs.report_available == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://zetyre.github.io/taller-playwright-atenea/
    concurrency:
      group: gh-pages-reports
      cancel-in-progress: false
    steps:
      - name: Check out repository with write access
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Playwright report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-artifacts

      - name: Append report to gh-pages branch
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          report_source="$RUNNER_TEMP/playwright-artifacts/playwright-report"
          if [[ ! -f "$report_source/index.html" ]]; then
            echo "Playwright HTML report was not found in the downloaded artifact."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pages_dir="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add --track -b gh-pages "$pages_dir" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$pages_dir"
          fi

          report_dir="$pages_dir/report-${GITHUB_RUN_NUMBER}"
          rm -rf -- "$report_dir"
          mkdir -p "$report_dir"
          cp -a "$report_source/." "$report_dir/"
          rm -rf -- "$report_dir/data"
          touch "$pages_dir/.nojekyll"

          mapfile -t archived_reports < <(
            find "$pages_dir" -maxdepth 1 -type d -name 'report-[0-9]*' -printf '%f\n' | sort -V
          )
          while (( ${#archived_reports[@]} > 30 )); do
            oldest_report="${archived_reports[0]}"
            rm -rf -- "$pages_dir/$oldest_report"
            archived_reports=("${archived_reports[@]:1}")
          done

          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n'
            printf '<meta charset="utf-8">\n<title>Playwright reports</title>\n'
            printf '</head>\n<body>\n<h1>Playwright reports</h1>\n<ul>\n'
            for report in "$pages_dir"/report-*; do
              [[ -d "$report" ]] || continue
              report_name="${report##*/}"
              printf '<li><a href="./%s/">%s</a></li>\n' "$report_name" "$report_name"
            done
            printf '</ul>\n</body>\n</html>\n'
          } > "$pages_dir/index.html"

          git -C "$pages_dir" add -- .nojekyll index.html "report-${GITHUB_RUN_NUMBER}"
          git -C "$pages_dir" commit -m "Publish Playwright report ${GITHUB_RUN_NUMBER}"
          git -C "$pages_dir" push origin gh-pages
