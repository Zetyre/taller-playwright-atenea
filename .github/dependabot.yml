version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*', 'prettier']
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; revisit when its peer range allows it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps. upload-artifact and download-artifact in particular
      # must move together, because artifacts are not compatible across their major versions.
      github-actions:
        patterns: ['*']
